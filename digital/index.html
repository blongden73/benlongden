<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben Longden - Digital</title>
  <link rel="stylesheet" href="style.css">

  <style>
    header {
          padding: 20px 40px;
          top: 0;
          left: 0;
          width: 90%;
          z-index: 100;
        }

    .logo {
        color: #fff;
    }

    .intro {
        padding: 20px 40px;
    }

    .intro h1{
        font-weight: 100;
        font-size: 10.2vw;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 1px;
        line-height: 1;
        margin: 0;
    }
  </style>
</head>
<body>
<header><div class="logo">Ben Longden</div></header>
<div class="intro">
    <h1>Selected Digital</h1>
</div>

<!-- 2 Column Flex Container -->
<div id="gallery" class="masonry-layout">
    <div class="column" id="col-1"></div>
    <div class="column" id="col-2"></div>
  </div>
  
  <div id="sentinel" class="loading">Loading more...</div>

  <script src="script.js"></script>
</body>
</html>
